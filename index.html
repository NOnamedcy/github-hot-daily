<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 热门项目雷达 · 每日更新</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e;
    --gold:#f0b429; --accent:#58a6ff; --hot:#f85149; --green:#3fb950;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 80px}
  header.top{padding:28px 0 8px}
  h1{font-size:28px;letter-spacing:.5px}
  h1 .radar{color:var(--gold)}
  .sub{color:var(--dim);margin-top:6px;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
  .chip{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:13px;color:var(--dim)}
  .chip b{color:var(--text);font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-top:20px;position:sticky;top:0;background:var(--bg);z-index:10;overflow-x:auto}
  .tab{padding:10px 18px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;font-size:15px;white-space:nowrap;user-select:none}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
  .toolbar{display:flex;gap:10px;margin:16px 0 12px;flex-wrap:wrap;align-items:center}
  .toolbar input{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-size:14px;outline:none}
  .toolbar input:focus{border-color:var(--accent)}
  .note{color:var(--dim);font-size:12.5px}
  .tablebox{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:var(--panel);color:var(--dim);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;font-weight:600}
  th:hover{color:var(--text)}
  th .arr{font-size:10px;margin-left:2px}
  td{padding:9px 12px;border-bottom:1px solid #21262d;vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#1c2128}
  .rank{color:var(--dim);font-variant-numeric:tabular-nums;width:36px}
  .rank.top{color:var(--gold);font-weight:700}
  .stars{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
  .badge{display:inline-block;border-radius:10px;padding:0 8px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .badge.hot{background:rgba(248,81,73,.15);color:var(--hot);border:1px solid rgba(248,81,73,.4)}
  .badge.warm{background:rgba(240,180,41,.12);color:var(--gold);border:1px solid rgba(240,180,41,.35)}
  .badge.calm{background:rgba(139,148,158,.1);color:var(--dim);border:1px solid var(--border)}
  .lang{color:var(--dim);font-size:12.5px;white-space:nowrap}
  .created{color:var(--dim);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .desc{color:#c9d1d9;font-size:13px;min-width:220px}
  .md h1{font-size:22px;margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .md h2{font-size:19px;margin:26px 0 10px;color:var(--gold)}
  .md h3{font-size:16px;margin:18px 0 8px}
  .md p{margin:8px 0;color:#c9d1d9;font-size:14.5px}
  .md li{margin:6px 0 6px 22px;color:#c9d1d9;font-size:14.5px}
  .md blockquote{border-left:3px solid var(--border);padding:4px 14px;color:var(--dim);margin:12px 0;background:var(--panel);border-radius:0 8px 8px 0}
  .md code{background:#1c2128;border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12.5px;color:var(--green);word-break:break-all}
  .md hr{border:none;border-top:1px solid var(--border);margin:20px 0}
  .err{color:var(--hot);padding:20px;font-size:14px}
  footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--border);color:var(--dim);font-size:12.5px;text-align:center}
  @media (max-width:640px){ h1{font-size:22px} .desc{min-width:160px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>GitHub 热门项目<span class="radar">雷达</span></h1>
    <div class="sub">涨星快 · 收藏高 · 每日自动更新（GitHub Actions → GitHub Pages）</div>
    <div class="chips" id="chips"></div>
  </header>

  <nav class="tabs" id="tabs">
    <div class="tab on" data-tab="rising">🔥 年度涨星榜</div>
    <div class="tab" data-tab="boom">🚀 近三月爆发榜</div>
    <div class="tab" data-tab="evergreen">🏛️ 长青经典榜</div>
    <div class="tab" data-tab="caps">📖 能力详解与速查</div>
  </nav>

  <div id="board">
    <div class="toolbar">
      <input id="q" type="search" placeholder="搜索项目名 / 简介 / 语言…">
      <span class="note" id="count"></span>
    </div>
    <div class="note" id="caliber" style="margin-bottom:10px"></div>
    <div class="tablebox">
      <table>
        <thead><tr>
          <th data-k="rank">#</th>
          <th data-k="name">项目</th>
          <th data-k="stars">星数 <span class="arr"></span></th>
          <th data-k="monthly">月均涨星 <span class="arr"></span></th>
          <th data-k="created">创建 <span class="arr"></span></th>
          <th data-k="lang">语言</th>
          <th>简介</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div id="caps" class="md" style="display:none"></div>

  <footer>
    数据源：GitHub Search API（每日北京时间 10:00 自动刷新） · 榜单中「月均涨星」= 总星数 ÷ 仓库月龄，为粗略估算<br>
    能力详解为人工策展内容（基于各项目 README 提炼） · 托管：GitHub Pages · 仓库：
    <a href="https://github.com/NOnamedcy/github-hot-daily" target="_blank" rel="noopener">NOnamedcy/github-hot-daily</a>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const state = { data:null, taglines:{}, tab:'rising', q:'', sortKey:null, sortDir:-1 };
const CALIBER = {
  rising:   '口径：近一年创建、星数 > 3,000，按总星数排序（新项目早期爆发，月均估值偏高）',
  boom:     '口径：近 100 天创建、星数 > 1,000，按总星数排序',
  evergreen:'口径：全站星数 > 40,000 的长青项目 TOP 40'
};
const fmt = n => n >= 10000 ? (n/10000).toFixed(1).replace(/\.0$/,'') + '万' : n.toLocaleString();
const fmtM = n => '≈' + fmt(n) + '/月';
const badgeClass = m => m >= 10000 ? 'hot' : m >= 3000 ? 'warm' : 'calm';
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function boot(){
  try{
    const [data, tag] = await Promise.all([
      fetch('data.json?_=' + Date.now()).then(r=>r.json()),
      fetch('taglines.json').then(r=>r.json()).catch(()=>({}))
    ]);
    state.data = data; state.taglines = tag;
    renderChips(); renderRows();
  }catch(e){
    $('#rows').innerHTML = `<tr><td colspan="7" class="err">数据加载失败：${esc(e.message)}（直接双击打开本文件时浏览器可能拦截 fetch，请访问在线版或本地起静态服务）</td></tr>`;
  }
}

function renderChips(){
  const d = state.data, L = d.lists;
  const total = new Set([...L.rising, ...L.boom, ...L.evergreen].map(x=>x.name)).size;
  const top = L.rising[0];
  const t = new Date(d.updated);
  const bj = t.toLocaleString('zh-CN', { timeZone:'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  $('#chips').innerHTML = [
    `收录 <b>${total}</b> 个项目`,
    `更新于 <b>${bj}</b>（北京）`,
    top ? `涨星榜首 <b>${esc(top.name)}</b> ★${fmt(top.stars)}` : '',
    `长青榜首 <b>${esc(L.evergreen[0]?.name||'')}</b>`
  ].filter(Boolean).map(s=>`<span class="chip">${s}</span>`).join('');
}

function currentList(){
  return state.data ? state.data.lists[state.tab] : [];
}

function renderRows(){
  const q = state.q.toLowerCase();
  let rows = currentList().map((x,i)=>({...x, rank:i+1}));
  if (q) rows = rows.filter(x =>
    x.name.toLowerCase().includes(q) ||
    (x.desc||'').toLowerCase().includes(q) ||
    (state.taglines[x.name.toLowerCase()]||'').toLowerCase().includes(q) ||
    (x.lang||'').toLowerCase().includes(q));
  if (state.sortKey && state.sortKey !== 'rank'){
    const k = state.sortKey, dir = state.sortDir;
    rows.sort((a,b)=> ((a[k]??'') > (b[k]??'') ? 1 : (a[k]??'') < (b[k]??'') ? -1 : 0) * dir);
  }
  $('#caliber').textContent = CALIBER[state.tab] || '';
  $('#count').textContent = `${rows.length} 条`;
  $('#rows').innerHTML = rows.map(x=>{
    const cn = state.taglines[x.name.toLowerCase()];
    const desc = cn || x.desc || '';
    return `<tr>
      <td class="rank ${x.rank<=3?'top':''}">${x.rank}</td>
      <td><a href="${x.url}" target="_blank" rel="noopener">${esc(x.name)}</a></td>
      <td class="stars">★ ${fmt(x.stars)}</td>
      <td><span class="badge ${badgeClass(x.monthly)}">${fmtM(x.monthly)}</span></td>
      <td class="created">${x.created}</td>
      <td class="lang">${esc(x.lang||'—')}</td>
      <td class="desc">${esc(desc)}</td>
    </tr>`;
  }).join('');
}

/* —— 迷你 Markdown 渲染器：标题/加粗/链接/行内代码/列表/引用/分割线 —— */
function inline(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}
function miniMd(src){
  const out = []; let list = null;
  const close = () => { if (list){ out.push(list==='ul'?'</ul>':'</ol>'); list=null; } };
  for (const raw of src.split('\n')){
    const line = raw.trimEnd();
    if (!line.trim()){ close(); continue; }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)/))){ close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if (/^-{3,}$/.test(line)){ close(); out.push('<hr>'); }
    else if (line.startsWith('> ')){ close(); out.push(`<blockquote>${inline(line.slice(2))}</blockquote>`); }
    else if (line.startsWith('- ')){ if (list!=='ul'){ close(); out.push('<ul>'); list='ul'; } out.push(`<li>${inline(line.slice(2))}</li>`); }
    else if ((m = line.match(/^\d+\.\s+(.*)/))){ if (list!=='ol'){ close(); out.push('<ol>'); list='ol'; } out.push(`<li>${inline(m[1])}</li>`); }
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return out.join('\n');
}

async function loadCaps(){
  const box = $('#caps');
  if (box.dataset.done) return;
  try{
    const src = await fetch('capabilities.md').then(r=>r.text());
    box.innerHTML = miniMd(src);
    box.dataset.done = '1';
  }catch(e){ box.innerHTML = `<p class="err">能力详解加载失败：${esc(e.message)}</p>`; }
}

$('#tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===t));
  state.tab = t.dataset.tab; state.sortKey = null;
  const isCaps = state.tab === 'caps';
  $('#board').style.display = isCaps ? 'none' : '';
  $('#caps').style.display = isCaps ? '' : 'none';
  if (isCaps) loadCaps(); else renderRows();
});
$('#q').addEventListener('input', e=>{ state.q = e.target.value; renderRows(); });
document.querySelectorAll('th[data-k]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const k = th.dataset.k;
    if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = -1; }
    renderRows();
  });
});
boot();
</script>
</body>
</html>
